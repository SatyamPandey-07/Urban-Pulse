name: Flutter CI/CD & Android Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate config.json from repository secrets
        env:
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          TOMTOM_KEY: ${{ secrets.TOMTOM_API_KEY }}
          REGISTRY_URL: ${{ secrets.CENTRAL_REGISTRY_BASE_URL }}
        run: |
          mkdir -p urbanpulse_flutter
          cat > urbanpulse_flutter/config.json <<EOF
          {
            "GROQ_API_KEY": "${GROQ_KEY}",
            "TOMTOM_API_KEY": "${TOMTOM_KEY}",
            "CENTRAL_REGISTRY_BASE_URL": "${REGISTRY_URL:-http://10.0.2.2:3001}"
          }
          EOF

      - name: Install Flutter Dependencies
        run: |
          cd urbanpulse_flutter
          flutter pub get

      - name: Analyze Flutter Code
        run: |
          cd urbanpulse_flutter
          flutter analyze

      - name: Build Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx3072m -XX:MaxMetaspaceSize=1024m'"
        run: |
          cd urbanpulse_flutter
          flutter build apk --release --dart-define-from-file=config.json

      - name: Package Release APK
        run: |
          ls -lh urbanpulse_flutter/build/app/outputs/flutter-apk/
          cp urbanpulse_flutter/build/app/outputs/flutter-apk/app-release.apk ./UrbanPulse-v1.3.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrbanPulse-v1.3.0-apk
          path: ./UrbanPulse-v1.3.0.apk
          retention-days: 30

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.0-hackcelestial' }}
          name: 🌿 UrbanPulse v1.3.0 — Flutter Production Release (HackCelestial 3.0)
          body: |
            ## 🌿 UrbanPulse — Intelligent Local Discovery, Sustainable Experience Platform & Autonomous Mobility 🚀

            **HackCelestial 3.0 — Flutter Multi-Platform Release**

            ### 📱 Download Android APK
            Tap the `UrbanPulse-v1.3.0.apk` asset below to install directly on your Android phone.

            ### ⚡ Core Platform Highlights
            - ⚡ **Exclusive Groq LPU Engine:** Sub-400ms conversational planning & real-time intent extraction.
            - 🚆 **TomTom Dual-Route Vector Engine:** Real-time electrified transit vs cab comparison with CO₂e savings.
            - ⏱️ **2-Hour Micro-Experience Finder:** Instant local recommendations tailored to live GPS coordinates.
            - ☔ **Real-Time Circumstance Adaptation:** Weather & transit delay self-healing itineraries.
            - 🦽 **Evidence-Based Accessibility:** ISO/ADA-aligned concourse ratings with crowd-sourced dispute verification.
            - 📄 **Hospitality ESG Optimizer:** ISO 14064 compliance reports with verifiable SHA-256 digests.
            - 🏪 **Provider Business Hub:** Zero-commission portal for local artisans and sustainable stays.
          files: ./UrbanPulse-v1.3.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
